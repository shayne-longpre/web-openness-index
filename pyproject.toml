[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "web-openness-observatory"
version = "0.1.0"
description = "Reproducible measurement of access to the public web"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dnspython>=2.8,<3",
  "httpx[http2]>=0.28,<1",
  "protego>=0.6.2,<1",
  "pydantic>=2.11,<3",
  "tldextract>=5.3.1,<6",
]

[project.scripts]
web-openness = "web_openness.cli:main"

[project.optional-dependencies]
browser = [
    "playwright>=1.61,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/web_openness"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["web_openness"]
